# SHOOT DICE — static frontend on Cloudflare Workers (free plan), same pipeline as Dog Fight:
# Workers Builds: build command `npm run build`, deploy command `npx wrangler deploy` (main = production),
# non-main branches -> preview URLs. No Worker script and no secrets in the practice milestone.
name = "shootdice"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
